spring.application.name=EjercicioSupermercado

# DATASOURCE H2

spring.datasource.url=jdbc:h2:mem:supermercado
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / HIBERNATE

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format-sql=true

#Para que H2 se porte como MySQL
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT (configurar via variable de entorno JWT_SECRET)
jwt.secret=${JWT_SECRET:supermercadoDefaultSecretKey2026ChangeMeInProduction}
jwt.expiration=${JWT_EXPIRATION:86400000}